<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quiz Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body, html {
      height: 100%;
      background: linear-gradient(135deg, #667eea, #764ba2);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
    }

    body::before {
      content: "";
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at center, rgba(255,255,255,0.15) 0%, transparent 70%);
      animation: rotateBG 20s linear infinite;
      z-index: 0;
      pointer-events: none;
    }

    @keyframes rotateBG {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    #quiz-container {
      position: relative;
      background: rgba(0, 0, 0, 0.6);
      padding: 2rem 3rem;
      border-radius: 15px;
      width: 90vw;
      max-width: 600px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 1;
      animation: fadeIn 0.8s ease forwards;
    }

    #start-screen, #quiz-screen, #result-screen, #report-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    #start-screen {
      display: flex;
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(20px);}
      to {opacity: 1; transform: translateY(0);}
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(255,255,255,0.3);
    }

    h2 {
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
      text-align: center;
      min-height: 60px;
      line-height: 1.3;
      text-shadow: 0 0 5px rgba(0,0,0,0.5);
    }

    /* Start screen */
    #start-screen input {
      padding: 0.5rem;
      font-size: 1.2rem;
      border-radius: 5px;
      border: none;
      margin-bottom: 1rem;
      width: 250px;
      text-align: center;
    }

    #start-screen button {
      background: #a18cd1;
      border: none;
      padding: 0.8rem 2rem;
      font-size: 1.2rem;
      border-radius: 30px;
      color: #fff;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(161,140,209,0.6);
      transition: background-color 0.3s, box-shadow 0.3s;
    }

    #start-screen button:hover {
      background: #8e7bc1;
      box-shadow: 0 6px 20px rgba(142,123,193,0.8);
    }

    #timer {
      font-size: 1.2rem;
      margin-bottom: 1rem;
      color: #ffd700;
      font-weight: bold;
    }

    #options {
      display: flex;
      flex-direction: column;
      width: 100%;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .option {
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid transparent;
      border-radius: 10px;
      padding: 0.8rem 1rem;
      font-size: 1.1rem;
      cursor: pointer;
      transition: background-color 0.3s, border-color 0.3s;
      display: flex;
      align-items: center;
      user-select: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    .option:hover {
      background: rgba(255, 255, 255, 0.25);
      border-color: #a18cd1;
    }

    .option.selected {
      background: #a18cd1;
      border-color: #6b4b9a;
      color: #fff;
      font-weight: 600;
      box-shadow: 0 0 15px #a18cd1;
    }

    .option input[type="radio"] {
      display: none;
    }

    #next-btn {
      background: #a18cd1;
      border: none;
      padding: 0.8rem 2rem;
      font-size: 1.2rem;
      border-radius: 30px;
      color: #fff;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(161,140,209,0.6);
      transition: background-color 0.3s, box-shadow 0.3s;
      align-self: center;
      user-select: none;
    }

    #next-btn:disabled {
      background: #7a6ea0;
      cursor: not-allowed;
      box-shadow: none;
    }

    #next-btn:hover:not(:disabled) {
      background: #8e7bc1;
      box-shadow: 0 6px 20px rgba(142,123,193,0.8);
    }

    #result-screen {
      text-align: center;
    }

    #result {
      font-size: 1.8rem;
      font-weight: 700;
      text-align: center;
      padding: 1rem 2rem;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(255,255,255,0.3);
      animation: popIn 0.6s ease forwards;
      margin-bottom: 1rem;
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    #detailed-report {
      width: 100%;
      max-height: 300px;
      overflow-y: auto;
      margin-bottom: 1rem;
      padding: 1rem;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
    }

    .report-item {
      margin-bottom: 1rem;
      padding: 0.5rem;
      border-radius: 5px;
      color: #fff;
    }

    .correct {
      background: rgba(34, 197, 94, 0.3);
    }

    .incorrect {
      background: rgba(239, 68, 68, 0.3);
    }

    .spark {
      position: absolute;
      width: 4px;
      height: 4px;
      background: #ffd700;
      border-radius: 50%;
      animation: sparkFade 2s linear forwards;
      pointer-events: none;
      z-index: 10;
    }

    @keyframes sparkFade {
      from {
        opacity: 1;
        transform: translateY(0);
      }
      to {
        opacity: 0;
        transform: translateY(-100px) scale(0);
      }
    }

    @media (max-width: 480px) {
      #quiz-container {
        padding: 1.5rem 2rem;
      }

      h1 {
        font-size: 2rem;
      }

      h2 {
        font-size: 1.2rem;
        min-height: auto;
      }

      #next-btn {
        width: 100%;
        font-size: 1rem;
        padding: 0.7rem 0;
      }
    }
  </style>
</head>
<body>
  <div id="quiz-container" role="main" aria-live="polite">
    <div id="start-screen">
      <h1>Quiz Game</h1>
      <p>Enter your name to start:</p>
      <input type="text" id="user-name" placeholder="Your Name" maxlength="50" />
      <button id="start-btn">Start Quiz</button>
    </div>

    <div id="quiz-screen">
      <h1>Quiz Game</h1>
      <div id="timer">Time: 20s</div>
      <h2 id="question">Loading question...</h2>
      <div id="options" role="list"></div>
      <button id="next-btn" disabled>Next</button>
    </div>

    <div id="result-screen">
      <h1>Quiz Game - Results</h1>
      <div id="result">Calculating score...</div>
      <button id="view-report-btn">View Detailed Report</button>
    </div>

    <div id="report-screen">
      <h1>Detailed Report</h1>
      <div id="detailed-report"></div>
      <button id="restart-btn">Restart Quiz</button>
    </div>
  </div>

  <script>
    const questions = [
      {
        question: "What is the capital of France?",
        options: ["Berlin", "Madrid", "Paris", "Rome"],
        answer: 2
      },
      {
        question: "Which planet is known as the Red Planet?",
        options: ["Earth", "Mars", "Jupiter", "Saturn"],
        answer: 1
      },
      {
        question: "Who wrote 'Hamlet'?",
        options: ["Charles Dickens", "William Shakespeare", "Mark Twain", "Leo Tolstoy"],
        answer: 1
      },
      {
        question: "What is the largest ocean on Earth?",
        options: ["Atlantic Ocean", "Indian Ocean", "Arctic Ocean", "Pacific Ocean"],
        answer: 3
      },
      {
        question: "Which element has the chemical symbol 'O'?",
        options: ["Gold", "Oxygen", "Silver", "Iron"],
        answer: 1
      }
    ];

    const startScreen = document.getElementById('start-screen');
    const quizScreen = document.getElementById('quiz-screen');
    const resultScreen = document.getElementById('result-screen');
    const reportScreen = document.getElementById('report-screen');
    const quizContainer = document.getElementById('quiz-container');

    const userNameInput = document.getElementById('user-name');
    const startBtn = document.getElementById('start-btn');
    const timerEl = document.getElementById('timer');
    const questionEl = document.getElementById('question');
    const optionsEl = document.getElementById('options');
    const nextBtn = document.getElementById('next-btn');
    const resultEl = document.getElementById('result');
    const viewReportBtn = document.getElementById('view-report-btn');
    const detailedReportEl = document.getElementById('detailed-report');
    const restartBtn = document.getElementById('restart-btn');

    let userName = '';
    let currentQuestionIndex = 0;
    let score = 0;
    let selectedOptionIndex = null;
    let timerInterval;
    let timeLeft = 20;
    let userAnswers = [];

    startBtn.addEventListener('click', () => {
      if (userNameInput.value.trim() === '') {
        alert('Please enter your name.');
        return;
      }
      userName = userNameInput.value.trim();
      startScreen.style.display = 'none';
      quizScreen.style.display = 'flex';
      loadQuestion();
    });

    function loadQuestion() {
      selectedOptionIndex = null;
      nextBtn.disabled = true;
      timeLeft = 20;
      updateTimer();

      quizContainer.style.pointerEvents = 'none';
      quizContainer.style.opacity = '0.5';

      setTimeout(() => {
        const currentQ = questions[currentQuestionIndex];
        questionEl.textContent = currentQ.question;

        optionsEl.innerHTML = '';

        currentQ.options.forEach((optionText, index) => {
          const optionDiv = document.createElement('div');
          optionDiv.classList.add('option');
          optionDiv.setAttribute('role', 'listitem');
          optionDiv.tabIndex = 0;
          optionDiv.dataset.index = index;

          const radioInput = document.createElement('input');
          radioInput.type = 'radio';
          radioInput.name = 'option';
          radioInput.id = `option${index}`;
          radioInput.value = index;
          radioInput.tabIndex = -1;

          optionDiv.appendChild(radioInput);

          const label = document.createElement('label');
          label.htmlFor = `option${index}`;
          label.textContent = optionText;
          label.style.flex = '1';
          optionDiv.appendChild(label);

          optionDiv.addEventListener('click', () => selectOption(index));
          optionDiv.addEventListener('keydown', e => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              selectOption(index);
            }
          });

          optionsEl.appendChild(optionDiv);
        });

        quizContainer.style.pointerEvents = 'auto';
        quizContainer.style.opacity = '1';

        timerInterval = setInterval(() => {
          timeLeft--;
          updateTimer();
          if (timeLeft <= 0) {
            clearInterval(timerInterval);
            handleTimeOut();
          }
        }, 1000);
      }, 300);
    }

    function updateTimer() {
      timerEl.textContent = `Time: ${timeLeft}s`;
      if (timeLeft <= 5) {
        timerEl.style.color = '#ff4444';
      } else {
        timerEl.style.color = '#ffd700';
      }
    }

    function handleTimeOut() {
      userAnswers.push({
        question: questions[currentQuestionIndex].question,
        userAnswer: null,
        correctAnswer: questions[currentQuestionIndex].options[questions[currentQuestionIndex].answer],
        isCorrect: false
      });
      currentQuestionIndex++;
      if (currentQuestionIndex < questions.length) {
        loadQuestion();
      } else {
        showResult();
      }
    }

    function selectOption(index) {
      selectedOptionIndex = index;
      nextBtn.disabled = false;

      const optionDivs = optionsEl.querySelectorAll('.option');
      optionDivs.forEach((opt, i) => {
        if (i === index) {
          opt.classList.add('selected');
          opt.querySelector('input').checked = true;
        } else {
          opt.classList.remove('selected');
          opt.querySelector('input').checked = false;
        }
      });
    }

    nextBtn.addEventListener('click', () => {
      if (selectedOptionIndex === null) return;

      clearInterval(timerInterval);

      const isCorrect = selectedOptionIndex === questions[currentQuestionIndex].answer;
      if (isCorrect) score++;

      userAnswers.push({
        question: questions[currentQuestionIndex].question,
        userAnswer: questions[currentQuestionIndex].options[selectedOptionIndex],
        correctAnswer: questions[currentQuestionIndex].options[questions[currentQuestionIndex].answer],
        isCorrect: isCorrect
      });

      currentQuestionIndex++;

      if (currentQuestionIndex < questions.length) {
        loadQuestion();
      } else {
        showResult();
      }
    });

    function showResult() {
      quizScreen.style.display = 'none';
      resultScreen.style.display = 'flex';
      resultEl.textContent = `${userName}, you scored ${score} out of ${questions.length}`;

      createSparks();
    }

    function createSparks() {
      for (let i = 0; i < 50; i++) {
        const spark = document.createElement('div');
        spark.classList.add('spark');
        spark.style.left = Math.random() * 100 + '%';
        spark.style.top = Math.random() * 100 + '%';
        spark.style.animationDelay = Math.random() * 2 + 's';
        document.body.appendChild(spark);

        setTimeout(() => {
          spark.remove();
        }, 2000);
      }
    }

    viewReportBtn.addEventListener('click', () => {
      resultScreen.style.display = 'none';
      reportScreen.style.display = 'flex';
      detailedReportEl.innerHTML = '<h3>Your Answers:</h3>';
      userAnswers.forEach((answer, index) => {
        const item = document.createElement('div');
        item.classList.add('report-item', answer.isCorrect ? 'correct' : 'incorrect');
        item.innerHTML = `
          <p><strong>Question ${index + 1}:</strong> ${answer.question}</p>
          <p>Your Answer: ${answer.userAnswer || 'Unanswered'}</p>
          <p>Correct Answer: ${answer.correctAnswer}</p>
          <p>Result: ${answer.isCorrect ? 'Correct' : 'Incorrect'}</p>
        `;
        detailedReportEl.appendChild(item);
      });
    });

    restartBtn.addEventListener('click', () => {
      currentQuestionIndex = 0;
      score = 0;
      userAnswers = [];
      reportScreen.style.display = 'none';
      startScreen.style.display = 'flex';
      userNameInput.value = '';
    });
  </script>
</body>
</html>
